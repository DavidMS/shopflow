spring.application.name=shopflow-orders

# Base de datos — H2 en memoria para desarrollo inicial
# Se reemplazará por PostgreSQL vía Docker Compose en T08
spring.datasource.url=jdbc:h2:mem:shopflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# ShopFlow business properties (T09 — @ConfigurationProperties)
shopflow.orders.max-items-per-order=50
shopflow.orders.default-page-size=20
shopflow.orders.pending-order-ttl-hours=48

# Structured logging (T09)
logging.pattern.console=%d{ISO8601} [%thread] [traceId=%X{traceId}] %-5level %logger{36} - %msg%n

# Resilience4j (T10 — payments circuit breaker)
resilience4j.circuitbreaker.instances.paymentsService.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentsService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentsService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.paymentsService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.paymentsService.minimum-number-of-calls=5
resilience4j.retry.instances.paymentsService.max-attempts=3
resilience4j.retry.instances.paymentsService.wait-duration=500ms
resilience4j.retry.instances.paymentsService.enable-exponential-backoff=true
resilience4j.retry.instances.paymentsService.exponential-backoff-multiplier=2

# Kafka (T13 — Outbox publisher)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
